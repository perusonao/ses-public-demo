name: Deploy S.E.S. Public Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Public Demo source
        uses: actions/checkout@v4
        with:
          repository: perusonao/smile_enjoy_story
          ref: codex/public-demo-01-mvp-a
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - run: flutter pub get
      - name: Validate Public Demo
        run: |
          flutter analyze lib/game/public_demo lib/ui/public_demo
          flutter test test/game/public_demo
          flutter test test/ui/public_demo/public_demo_01_playthrough_test.dart
          flutter test test/ui/public_demo/public_demo_01_success_playthrough_test.dart
      - name: Build web
        run: flutter build web --release --base-href /ses-public-demo/
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}#/public-demo-01
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
